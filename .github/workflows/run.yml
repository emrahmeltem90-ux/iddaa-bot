name: Anlik Iddaa Gol ve Oran Sinyali

on:
  schedule:
    # Türkiye Saati ile 10:00 ve 18:00'de otomatik çalışır (UTC 07:00 ve 15:00)
    - cron: '0 7,15 * * *'
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Botu Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analiz.py
