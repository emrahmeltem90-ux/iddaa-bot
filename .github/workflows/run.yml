name: Gunluk ve Spor Toto Analiz

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python analiz.py
      - run: python sportoto.py
